name: Sync GitHub Issues to Notion

on:
  issues:
    types: [labeled]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  sync_to_notion:
    # 'sync' 라벨이 붙었을 때만 실행
    if: github.event.label.name == 'sync'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Sync Script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          # Project V2 접근 권한이 있는 토큰 (아래 '주의사항' 참고)
          GITHUB_TOKEN: ${{ secrets.PROJECT_PAT || secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_STATE: ${{ github.event.issue.state }}
          CREATED_AT: ${{ github.event.issue.created_at }}
        run: |
          python - << 'PYEOF'
          import os, sys, requests

          NOTION_TOKEN = os.environ["NOTION_TOKEN"]
          DATABASE_ID  = os.environ["NOTION_DATABASE_ID"]
          GITHUB_TOKEN = os.environ.get("GITHUB_TOKEN")
          REPO_OWNER   = os.environ.get("REPO_OWNER")
          REPO_NAME    = os.environ.get("REPO_NAME")
          ISSUE_NUMBER = os.environ.get("ISSUE_NUMBER")
          ISSUE_TITLE  = os.environ["ISSUE_TITLE"]
          ISSUE_STATE  = os.environ["ISSUE_STATE"]
          CREATED_AT   = os.environ["CREATED_AT"]

          HEADERS = {
              "Authorization":  f"Bearer {NOTION_TOKEN}",
              "Content-Type":   "application/json",
              "Notion-Version": "2022-06-28",
          }

          # 1. GitHub GraphQL API로 Project의 Start date / Target date 가져오기
          def get_project_dates():
              start_date, target_date = None, None
              if not GITHUB_TOKEN: return start_date, target_date
              
              url = "https://api.github.com/graphql"
              gh_headers = {"Authorization": f"Bearer {GITHUB_TOKEN}"}
              
              # 이슈가 속한 프로젝트의 날짜 필드를 가져오는 GraphQL 쿼리
              query = """
              query($owner: String!, $repo: String!, $issue: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $issue) {
                    projectItems(first: 5) {
                      nodes {
                        fieldValues(first: 20) {
                          nodes {
                            ... on ProjectV2ItemFieldDateValue {
                              date
                              field { ... on ProjectV2Field { name } }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
              """
              variables = {"owner": REPO_OWNER, "repo": REPO_NAME, "issue": int(ISSUE_NUMBER)}
              try:
                  res = requests.post(url, headers=gh_headers, json={"query": query, "variables": variables})
                  data = res.json()
                  
                  if "errors" in data:
                      print(f"⚠️ GraphQL 에러 (Project 권한이 부족할 수 있습니다): {data['errors']}")
                      return start_date, target_date

                  # 쿼리 응답 파싱
                  items = data.get("data", {}).get("repository", {}).get("issue", {}).get("projectItems", {}).get("nodes", [])
                  for item in items:
                      fields = item.get("fieldValues", {}).get("nodes", [])
                      for field in fields:
                          if not field: continue
                          field_name = field.get("field", {}).get("name")
                          if field_name == "Start date":
                              start_date = field.get("date")
                          elif field_name == "Target date":
                              target_date = field.get("date")
              except Exception as e:
                  print(f"⚠️ Project 날짜 조회 실패: {e}")
                  
              return start_date, target_date

          proj_start, proj_target = get_project_dates()

          # 날짜 세팅: Project의 Start date가 있으면 사용, 없으면 이슈 생성일(CREATED_AT) 사용
          final_start = proj_start if proj_start else CREATED_AT
          date_prop = {"start": final_start}
          if proj_target:
              date_prop["end"] = proj_target

          def find_existing_page():
              url = f"https://api.notion.com/v1/databases/{DATABASE_ID}/query"
              payload = {
                  "filter": {
                      "property": "이름",
                      "title": {"equals": ISSUE_TITLE},
                  }
              }
              res = requests.post(url, headers=HEADERS, json=payload)
              res.raise_for_status()
              results = res.json().get("results", [])
              return results[0]["id"] if results else None

          def build_properties():
              return {
                  "이름": {
                      "title": [{"text": {"content": ISSUE_TITLE}}]
                  },
                  "날짜": {
                      "date": date_prop
                  },
                  "담당자": {
                      "people": [{"object": "user", "id": "71fea15f-fab3-4595-8547-f3de23871c21"}]
                  },
                  "명료화": {
                      "select": {"name": "다음행동"}
                  },
                  "속성": {
                      "select": {"name": "코드"}
                  },
                  # 2. 완료 체크박스 반영 (closed 상태면 True)
                  "완료": {
                      "checkbox": (ISSUE_STATE == "closed")
                  },
              }

          try:
              print(f"[sync_notion] '{ISSUE_TITLE}' (State: {ISSUE_STATE})")
              page_id = find_existing_page()

              if page_id:
                  print(f"[sync_notion] 기존 페이지 발견 → 업데이트 (id={page_id})")
                  url = f"https://api.notion.com/v1/pages/{page_id}"
                  res = requests.patch(url, headers=HEADERS, json={"properties": build_properties()})
                  res.raise_for_status()
                  print(f"✅ 업데이트 완료 | status={res.status_code}")
              else:
                  print("[sync_notion] 새 페이지 생성")
                  url = "https://api.notion.com/v1/pages"
                  payload = {
                      "parent": {"database_id": DATABASE_ID},
                      "properties": build_properties(),
                  }
                  res = requests.post(url, headers=HEADERS, json=payload)
                  res.raise_for_status()
                  print(f"✅ 생성 완료 | status={res.status_code}")

          except requests.HTTPError as e:
              print(f"❌ Notion API 오류: {e.response.status_code} {e.response.text}", file=sys.stderr)
              sys.exit(1)
          except Exception as e:
              print(f"❌ 예기치 않은 오류: {e}", file=sys.stderr)
              sys.exit(1)
          PYEOF

      # 3. 모든 작업이 성공하면 'sync' 라벨 자동으로 떼기
      - name: Remove 'sync' label
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --remove-label "sync"
